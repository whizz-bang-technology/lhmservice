name: Build and release

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to create from this commit, e.g. 1.1.0 (blank = build only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Work out version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $tag = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:INPUT_VERSION) {
            if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3" }
            $tag = "v$env:INPUT_VERSION"
          }
          $v = if ($tag) { $tag.TrimStart('v') } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag"   >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/LHMService.csproj -c Release -o publish --nologo -p:Version=${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/LHMService.exe, publish/appsettings.json, scripts/Install-LHMService.ps1, scripts/Uninstall-LHMService.ps1 dist/
          Push-Location dist
          Get-ChildItem -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v6
        with:
          name: lhmservice-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Attest build provenance
        if: steps.ver.outputs.tag != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/LHMService.exe'

      - name: Create release
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Works for a pushed tag, a release drafted in the GitHub UI, or a manual run.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG (Get-ChildItem dist/*).FullName --clobber
          } else {
            gh release create $env:TAG (Get-ChildItem dist/*).FullName --target $env:GITHUB_SHA --title "LHMService $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
